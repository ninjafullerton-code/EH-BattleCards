<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Card</title>

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #1f1f24;
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: 320px;
      height: 470px;
      padding: 12px;
      background: linear-gradient(135deg, #b9823b, #e2b66b, #8d5726);
      border: 8px solid #2a1a0d;
      border-radius: 10px;
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.55),
        inset 0 0 0 3px rgba(255, 235, 180, 0.5);
      box-sizing: border-box;
    }

    .card-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #c8914e;
      border: 2px solid #3a2410;
      padding: 8px;
      box-sizing: border-box;
    }

    .card-title {
      background: linear-gradient(to right, #f4d58a, #c08a3d);
      border: 2px solid #3a2410;
      padding: 6px 8px;
      font-size: 1.25rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-stars {
      height: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 3px;
      padding-right: 4px;
      font-size: 1.1rem;
      color: #d71920;
      text-shadow: 1px 1px 0 #f7c873;
    }

    .card-art {
      height: 210px;
      border: 4px solid #3a2410;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.3), transparent 35%),
        linear-gradient(135deg, #334155, #111827);
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.1rem;
      text-align: center;
      padding: 12px;
      box-sizing: border-box;
    }

    .card-textbox {
      flex: 1;
      background: #e8d4ae;
      border: 3px solid #3a2410;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }

    .card-type {
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 6px;
      border-bottom: 1px solid #5a3a1c;
      padding-bottom: 4px;
    }

    .card-description {
      font-size: 0.85rem;
      line-height: 1.25;
    }

    .card-stats {
      text-align: right;
      font-weight: bold;
      font-size: 0.9rem;
      border-top: 1px solid #5a3a1c;
      padding-top: 4px;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <article class="card">
    <div class="card-inner">

      <header class="card-title">
        Dark Example Dragon
      </header>

      <div class="card-stars">
        ★ ★ ★ ★ ★ ★
      </div>

      <section class="card-art">
        Replace this with an image, icon, sprite, or canvas.
      </section>

      <section class="card-textbox">
        <div>
          <div class="card-type">
            [Dragon / Effect]
          </div>

          <div class="card-description">
            This is the main effect text area. You can swap this HTML with
            paragraphs, lists, icons, badges, or custom content.
          </div>
        </div>

        <footer class="card-stats">
          ATK / 2400 &nbsp;&nbsp; DEF / 1800
        </footer>
      </section>

    </div>
  </article>
</body>
</html>
